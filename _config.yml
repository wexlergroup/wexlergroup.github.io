# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: The Wexler Group
masthead_title: The W<i>e<sup>x</sup></i>ler Group
subtitle: At Washington University in St. Louis
email: wexler@wustl.edu
description: >- # this means to ignore newlines until "baseurl:"
  The Wexler Group develops computational methods and designs materials for
  clean hydrogen production, carbon dioxide conversion, renewable energy, and
  environmental applications.
github_username: wexlergroup
minimal_mistakes_skin: default
search: true
logo: "/assets/images/masthead-logo.png"

# Build settings
markdown: kramdown
remote_theme: mmistakes/minimal-mistakes
# Outputting
permalink: /:categories/:title/
paginate: 5 # amount of posts to show
paginate_path: /page:num/
timezone: # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones

include:
  - _pages

# Exclude from processing.
exclude:
  - AGENTS.md
  - CLAUDE.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
  - jekyll-include-cache

author:
  name   : "The Wexler Group"
  bio    : "Computational materials chemistry for energy and environmental applications at Washington University in St. Louis."
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:wexler@wustl.edu"
#    - label: "Twitter"
#      icon: "fab fa-fw fa-twitter-square"
#      url: "https://twitter.com/robertowexler"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/wexlergroup"
#    - label: "Instagram"
#      icon: "fab fa-fw fa-instagram"
#      url: "https://instagram.com/"

footer:
  links:
#    - label: "Twitter"
#      icon: "fab fa-fw fa-twitter-square"
#      url: "https://twitter.com/robertowexler"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/wexlergroup"
#    - label: "Instagram"
#      icon: "fab fa-fw fa-instagram"
#      url: "https://instagram.com/"

defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false  # true
      read_time: false  # true
      comments: false  # true
      share: false  # true
      related: false  # true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true
